‎<!DOCTYPE html>
<html lang="en">
‎<head>
‎    <meta charset="UTF-8">
‎    <meta name="viewport" content="width=device-width, initial-scale=1.0">
‎    <title>Voice Chatbot</title>
‎    <style>
‎        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
‎        .chat-container { width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
‎        #status { margin-top: 15px; font-weight: bold; color: #555; }
‎    </style>
‎</head>
‎<body>
‎    <div class="chat-container">
‎        <h2>Voice Chatbot</h2>
‎        <button id="start-btn" onclick="startVoiceInteraction()">Start Voice Call</button>
‎        <div id="status">Click the button to start speaking.</div>
‎    </div>
‎
‎    <script>
‎        const API_KEY = "AQ.Ab8RN6J1-N_gpckvDPVBOKnPt42dF49uheEOHfmG96Ec3NpQQw";
‎
‎        async function startVoiceInteraction() {
‎            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
‎            if (!SpeechRecognition) {
‎                alert("Speech recognition not supported in this browser.");
‎                return;
‎            }
‎
‎            const recognition = new SpeechRecognition();
‎            recognition.lang = 'bn-BD';
‎            recognition.start();
‎            document.getElementById('status').innerText = "Listening...";
‎
‎            recognition.onresult = async (event) => {
‎                const transcript = event.results[0][0].transcript;
‎                document.getElementById('status').innerText = "You said: " + transcript;
‎
‎                try {
‎                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
‎                        method: 'POST',
‎                        headers: { 'Content-Type': 'application/json' },
‎                        body: JSON.stringify({
‎                            contents: [{ parts: [{ text: transcript }] }]
‎                        })
‎                    });
‎
‎                    const data = await response.json();
‎                    const reply = data.candidates[0].content.parts[0].text;
‎                    speak(reply);
‎                } catch (error) {
‎                    console.error("Error:", error);
‎                    document.getElementById('status').innerText = "Error connecting to AI.";
‎                }
‎            };
‎        }
‎
‎        function speak(text) {
‎            const utterance = new SpeechSynthesisUtterance(text);
‎            utterance.lang = 'bn-BD';
‎            document.getElementById('status').innerText = "AI: " + text;
‎            window.speechSynthesis.speak(utterance);
‎        }
‎    </script>
‎</body>
‎</html>
‎
