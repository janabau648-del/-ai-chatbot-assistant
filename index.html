‎<!DOCTYPE html>
<html lang="en">
‎<head>
‎    <meta charset="UTF-8">
‎    <meta name="viewport" content="width=device-width, initial-scale=1.0">
‎    <title>BDCS Official Cyber Security Hridoy</title>
‎    <style>
‎        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
‎        .chat-container { width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
‎        #chat-box { height: 300px; border: 1px solid #ddd; padding: 10px; overflow-y: scroll; margin-bottom: 10px; }
‎        input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }

‎</head>
‎<body>

‎    <script>
‎        async function sendMessage() {
‎            let input = document.getElementById("user-input").value;
‎            if (input.trim() !== "") {
‎                document.getElementById("chat-box").innerHTML += "<div><b>You:</b> " + input + "</div>";
‎                document.getElementById("user-input").value = "";
‎
‎                try {
‎                    let response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AQ.Ab8RN6J1-N_gpckvDPVBOKnPt42dF49uheEOHfmG96Ec3NpQQw", {
‎                        method: "POST",
‎                        headers: { "Content-Type": "application/json" },
‎                        body: JSON.stringify({ contents: [{ parts: [{ text: input }] }] })
‎                    });
‎                    let data = await response.json();
‎                    let reply = data.candidates[0].content.parts[0].text;
‎                    document.getElementById("chat-box").innerHTML += "<div><b>AI:</b> " + reply + "</div>";
‎                } catch (error) {
‎                    console.error("Error:", error);
‎                    document.getElementById("chat-box").innerHTML += "<div><b>System:</b> Error connecting to AI.</div>";
‎                }
‎            }
‎        }
‎    </script>
